name: app_lectura
description: Biblioteca y lector personal de PDF sin conexion.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  crypto: ^3.0.8
  file_picker: ^13.4.0
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  material_ui: ^1.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfrx: ^3.0.1
  sqflite: ^2.4.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Lora-OFL.txt
    - assets/fonts/Atkinson-OFL.txt
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
    - family: Atkinson
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
